---
# Builds the native Cocoa/Metal macOS client (docs/metal-implementation-plan.md, Phase 1).
#
# This job builds the Cocoa configuration rather than the default XQuartz one on purpose:
# XQuartz is a .dmg install that a hosted runner cannot reasonably provide, whereas the
# Cocoa build needs no X11 at all. That is only true because the Cocoa build stopped
# linking X11 - which this job also guards, so the regression cannot come back unnoticed.
name: Build - macOS (Cocoa)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - "tests/**"
      - ".github/workflows/build-macos.yml"
      # The Metal capture step drives the scene list from the manifest, so a manifest or
      # query-tool change has to re-run this job or the step silently attempts a stale list.
      - "docs/rendering-baselines/scenes.json"
      - "tools/renderer_scenes.py"
  pull_request:
    paths:
      - "src/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - "tests/**"
      - ".github/workflows/build-macos.yml"
      # The Metal capture step drives the scene list from the manifest, so a manifest or
      # query-tool change has to re-run this job or the step silently attempts a stale list.
      - "docs/rendering-baselines/scenes.json"
      - "tools/renderer_scenes.py"

permissions:
  contents: read

concurrency:
  group: crystalotc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 3
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg
  CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
  CCACHE_MAXSIZE: 2G
  # run-vcpkg otherwise sets this to 'clear;x-gha,readwrite'; that backend has been removed
  # from vcpkg, so it warns and nothing is cached. Use the directory actions/cache restores.
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.cache/vcpkg,readwrite"

jobs:
  cocoa-release:
    name: macOS Cocoa release
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Record environment fingerprint
        run: |
          set -euo pipefail
          {
            echo "commit=${GITHUB_SHA}"
            echo "runner_label=macos-15"
            echo "runner_image=${ImageOS:-unknown}/${ImageVersion:-unknown}"
            echo "macos_version=$(sw_vers -productVersion)"
            echo "arch=$(uname -m)"
            echo "xcode=$(xcodebuild -version | head -1)"
            echo "sdk=$(xcrun --show-sdk-version)"
            echo "cmake=$(cmake --version | head -1)"
          } | tee "$RUNNER_TEMP/macos-env.txt"

      - name: Install ccache
        run: brew install ccache

      - name: Read pinned vcpkg baseline
        id: vcpkg
        run: echo "commit=$(python3 -c 'import json; print(json.load(open("vcpkg.json"))["builtin-baseline"])')" >> "$GITHUB_OUTPUT"

      # vcpkg aborts at startup when VCPKG_DEFAULT_BINARY_CACHE names a directory that
      # does not exist, and nothing else in this job creates it.
      - name: Create cache directories
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE" "$CCACHE_DIR"

      - name: Cache vcpkg binaries and downloads
        uses: actions/cache@v6
        with:
          path: |
            ${{ github.workspace }}/.cache/vcpkg
            ${{ github.workspace }}/vcpkg/downloads
          key: vcpkg-macos-release-${{ steps.vcpkg.outputs.commit }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-macos-release-${{ steps.vcpkg.outputs.commit }}-
            vcpkg-macos-release-

      - name: Cache compiler cache (ccache)
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cache/ccache
          key: ccache-macos-release-${{ github.sha }}
          restore-keys: |
            ccache-macos-release-

      - name: Install pinned vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: ${{ steps.vcpkg.outputs.commit }}
          # Without this the action globs '**/vcpkg.json' and also matches the port
          # manifests inside the vcpkg checkout, warning that it found several.
          vcpkgJsonGlob: "vcpkg.json"

      # The macos-release preset enables sccache, which is not installed here; ccache is.
      # TOGGLE_COCOA_WINDOW also defaults the deployment target to 14.0, so LSMinimumSystemVersion
      # below is asserted rather than assumed.
      - name: Configure
        run: |
          cmake --preset macos-release \
            -DTOGGLE_COCOA_WINDOW=ON \
            -DOPTIONS_ENABLE_SCCACHE=OFF \
            -DOPTIONS_ENABLE_CCACHE=ON

      - name: Build
        run: cmake --build --preset macos-release --parallel 3

      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats || true

      - name: Run unit tests
        run: ctest --test-dir build/macos-release --output-on-failure

      - name: Check the app bundle
        run: |
          set -euo pipefail
          APP="build/macos-release/bin/CrystalOTC.app"
          test -d "$APP" || { echo "::error::$APP was not produced"; exit 1; }
          test -x "$APP/Contents/MacOS/CrystalOTC" || { echo "::error::bundle executable missing"; exit 1; }
          plutil -lint "$APP/Contents/Info.plist"

          # NSHighResolutionCapable is load-bearing: without it the window server hands the
          # app a 1x backing store, backingScaleFactor reads 1.0 on a Retina display, and
          # CocoaWindow's pixels-vs-points contract silently becomes false.
          for key in CFBundleIdentifier CFBundleExecutable NSHighResolutionCapable LSMinimumSystemVersion; do
            value="$(plutil -extract "$key" raw "$APP/Contents/Info.plist")"
            test -n "$value" || { echo "::error::Info.plist $key is empty"; exit 1; }
            echo "  $key=$value"
          done

      # The reason this job can run on a hosted runner at all. If FindOpenGL's X11 fold ever
      # comes back, or someone links X11::X11 unconditionally again, this fails loudly rather
      # than quietly reintroducing an XQuartz build dependency.
      - name: Assert the Cocoa build links no X11
        run: |
          set -euo pipefail
          BIN="build/macos-release/bin/CrystalOTC.app/Contents/MacOS/CrystalOTC"
          echo "--- otool -L ---"
          otool -L "$BIN"
          if otool -L "$BIN" | grep -qiE "/opt/X11|libX11|libXext|libGLU"; then
            echo "::error::the Cocoa build links X11 or GLU; see cmake/FindOpenGL.cmake and src/CMakeLists.txt"
            exit 1
          fi
          for fw in AppKit Metal QuartzCore; do
            otool -L "$BIN" | grep -q "$fw.framework" || { echo "::error::$fw not linked"; exit 1; }
          done
          echo "no X11, and AppKit/Metal/QuartzCore all present"

      # Boots the real client far enough to load every Lua module and bring up the renderer. It
      # cannot present a frame without a window server, so the markers checked here are module
      # startup and backend selection, not pixels.
      - name: Smoke launch
        run: |
          set -uo pipefail
          APP="build/macos-release/bin/CrystalOTC.app"
          "$APP/Contents/MacOS/CrystalOTC" > "$RUNNER_TEMP/smoke.log" 2>&1 &
          PID=$!
          sleep 45
          if kill -0 "$PID" 2>/dev/null; then
            echo "still running after 45s (expected)"
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
            alive=1
          else
            wait "$PID" 2>/dev/null; rc=$?
            echo "exited early with code $rc"
            alive=0
          fi

          echo "--- smoke log ---"
          cat "$RUNNER_TEMP/smoke.log" || true

          # CocoaWindow reports hasGLContext() == false, so Graphics::init takes its
          # no-GL branch and logs this. Reaching it means the window, the platform layer
          # and the whole Lua module load came up.
          if ! grep -q "OpenGL initialization skipped" "$RUNNER_TEMP/smoke.log"; then
            echo "::error::client did not reach graphics init; see the smoke log above"
            exit 1
          fi

          # Since Phase 4 the same no-GL branch is what selects the Metal backend, so the run
          # can assert which renderer came up rather than only that graphics init was reached.
          # A hosted runner has no window server and therefore never presents a frame, but the
          # device, the queue and the built-in MSL library are all created before one is needed -
          # so a failure here is a real Metal problem and not a missing display.
          if ! grep -q "render path: frame (backend 'metal')" "$RUNNER_TEMP/smoke.log"; then
            echo "::error::client did not bring up the Metal backend; see the smoke log above"
            exit 1
          fi

          # Phase 5 made the CPU texture atlas backend-neutral and turned it back on under Metal.
          # That is invisible in a capture - an atlas-backed draw and a standalone one produce
          # the same picture - so a regression switching it off again would look exactly like
          # nothing happening. Assert it here, where no window server is needed to see it.
          if ! grep -q "CPU atlases: map=[0-9]" "$RUNNER_TEMP/smoke.log"; then
            echo "::error::CPU atlases did not come up under Metal; see the smoke log above"
            exit 1
          fi

          if [ "$alive" -ne 1 ]; then
            echo "::error::client exited on its own during the smoke launch"
            exit 1
          fi
          echo "smoke launch OK"

      # Deliberately NON-GATING, and the reason is the point of the step: nobody knows yet
      # whether a hosted runner can produce a frame at all. The Metal backend renders into an
      # offscreen target and only needs a drawable to PRESENT, so a capture - which reads that
      # target between frames - has a real chance of working with no window server. If it does,
      # Phase 7 gets a macOS image matrix for free; if it does not, this says so once instead of
      # being rediscovered. Either way the step must not fail the build over an open question.
      - name: Attempt Metal scene captures (non-gating)
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          APP="build/macos-release/bin/CrystalOTC.app/Contents/MacOS/CrystalOTC"
          OUT="$RUNNER_TEMP/metal-captures"
          mkdir -p "$OUT"

          python3 tools/renderer_scenes.py ids --offline > "$RUNNER_TEMP/offline-scenes.txt"
          scenes=()
          while IFS= read -r line; do
            [ -n "$line" ] && scenes+=("$line")
          done < "$RUNNER_TEMP/offline-scenes.txt"

          if [ "${#scenes[@]}" -eq 0 ]; then
            echo "::warning::no offline scenes listed; nothing attempted"
            exit 0
          fi

          # `ids --offline` already excludes the scenes a headless runner cannot produce at all
          # (windowing is a desktop driver, not a capture), so no second filter is needed here -
          # the manifest stays the single source of truth, exactly as the Linux job treats it.
          captured=0
          for scene in "${scenes[@]}"; do
            log="$OUT/$scene.log"
            read -r -a client_args <<< "$(python3 tools/renderer_scenes.py field "$scene" command)"
            "$APP" "${client_args[@]}" > "$log" 2>&1 &
            pid=$!
            # The capture driver exits on its own; this only bounds a hang.
            for _ in $(seq 1 90); do
              kill -0 "$pid" 2>/dev/null || break
              sleep 1
            done
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true

            src="$HOME/Library/Application Support/crystalotc-baseline/.crystalotc-baseline/render-baselines/$scene.png"
            if [ -f "$src" ]; then
              cp "$src" "$OUT/$scene.png"
              captured=$((captured + 1))
              echo "captured $scene"
            else
              echo "no capture for $scene (see $scene.log)"
            fi
          done

          echo "metal captures produced: $captured"
          if [ "$captured" -eq 0 ]; then
            echo "::notice::a hosted macOS runner produced no Metal captures; the offscreen path needs a display after all"
          else
            echo "::notice::a hosted macOS runner produced $captured Metal captures without a window server"
          fi

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-cocoa-${{ github.sha }}
          path: |
            ${{ runner.temp }}/macos-env.txt
            ${{ runner.temp }}/smoke.log
            ${{ runner.temp }}/metal-captures
          if-no-files-found: ignore
          retention-days: 7
