name: Build - Windows

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - "vcpkg.json"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/workflows/build-windows.yml"
  push:
    branches: [main, "15.33", "ci/**"]
    paths:
      - "src/**"
      - "cmake/**"
      - "vcpkg.json"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/workflows/build-windows.yml"
      # The "latest" release bundles these, so it must be rebuilt when they change.
      - "init.lua"
      - "data/**"
      - "modules/**"
      - "mods/**"

permissions:
  contents: read
  pull-requests: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  MAKEFLAGS: "-j 2"

jobs:
  build:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: windows-2022-${{ matrix.configuration }}
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        configuration: [release, debug]

    concurrency:
      group: crystalotc-${{ github.workflow }}-${{ github.ref }}-${{ matrix.configuration }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get vcpkg commit ID
        id: vcpkg-step
        shell: pwsh
        run: |
          $json = Get-Content vcpkg.json -Raw | ConvertFrom-Json
          $commit = $json.'builtin-baseline'
          echo "vcpkgGitCommitId=$commit" >> $env:GITHUB_OUTPUT

      - name: Validate vcpkg baseline SHA
        shell: pwsh
        run: |
          $SHAS = "${{ steps.vcpkg-step.outputs.vcpkgGitCommitId }}"
          if ([string]::IsNullOrEmpty($SHAS)) {
            echo "::error title=Missing vcpkg baseline::Provide a full 40-char vcpkgGitCommitId."
            exit 1
          }
          if ($SHAS -notmatch '^[0-9a-f]{40}$') {
            echo "::error title=Invalid vcpkg baseline::vcpkgGitCommitId must be a full 40-char commit SHA."
            exit 1
          }

      - name: Compute vcpkg.json hash
        id: hash
        shell: pwsh
        run: |
          $json = Get-Content "vcpkg.json" -Raw -Encoding UTF8
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($json)
          $sha256 = [System.Security.Cryptography.SHA256]::Create()
          $hashBytes = $sha256.ComputeHash($bytes)
          $hash = [BitConverter]::ToString($hashBytes) -replace '-', ''
          "hash=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg/installed
            ${{ github.workspace }}/vcpkg/buildtrees
            ${{ github.workspace }}/vcpkg/downloads
          key: vcpkg-windows-${{ matrix.configuration }}-${{ steps.hash.outputs.hash }}
          restore-keys: |
            vcpkg-windows-${{ matrix.configuration }}-

      - name: Compiler cache (sccache)
        uses: hendrikmuhs/ccache-action@main
        with:
          max-size: "1G"
          variant: "sccache"
          key: ccache-windows-${{ matrix.configuration }}
          restore-keys: |
            ccache-windows-${{ matrix.configuration }}

      - name: Remove Windows pre-installed MySQL (for clean builds)
        run: Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "C:/mysql*"

      - name: Install vcpkg
        uses: lukka/run-vcpkg@a400452f634fe49e9f18d388aeb1809dcc642136
        with:
          vcpkgGitCommitId: ${{ steps.vcpkg-step.outputs.vcpkgGitCommitId }}

      - name: Get latest CMake and Ninja
        uses: lukka/get-cmake@v3.31.6

      # The packaged build is the client only: unit tests are off, so no gtest
      # binary can end up in the artifact, and the client is linked into a known
      # folder (build/windows-release/bin) instead of the repository root.
      - name: Configure and Build
        uses: lukka/run-cmake@main
        with:
          configurePreset: windows-${{ matrix.configuration }}
          # /Z7 (debug info inside the .obj) instead of /Zi: sccache cannot cache objects that write to a shared PDB
          configurePresetAdditionalArgs: "['-DOTCLIENT_BUILD_TESTS=OFF', '-DTOGGLE_BIN_FOLDER=ON', '-DCMAKE_POLICY_DEFAULT_CMP0141=NEW', '-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded']"
          buildPreset: windows-${{ matrix.configuration }}
          buildPresetAdditionalArgs: "['--target', 'otclient']"

      - name: Prepare artifact folder
        shell: pwsh
        run: |
          $artifactDir = "$env:GITHUB_WORKSPACE\artifacts"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

          $binDir = "$env:GITHUB_WORKSPACE\build\windows-${{ matrix.configuration }}\bin"
          $exePath = Get-Item "$binDir\otclient.exe" -ErrorAction SilentlyContinue

          if (-not $exePath) {
            Write-Error "otclient.exe not found in $binDir"
            exit 1
          }

          # Refuse to ship anything that is not the real client: it must be a GUI
          # program (no console window), must not be a gtest binary and must carry
          # the ANGLE renderer that the DirectX 11 / OpenGL options use.
          $bytes = [System.IO.File]::ReadAllBytes($exePath.FullName)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $subsystem = [BitConverter]::ToUInt16($bytes, $peOffset + 0x5C)
          # Release is a GUI program (2); the Debug build keeps its console (3) for the log.
          $expectedSubsystem = if ("${{ matrix.configuration }}" -eq "release") { 2 } else { 3 }
          if ($subsystem -ne $expectedSubsystem) {
            Write-Error "otclient.exe has PE subsystem $subsystem, expected $expectedSubsystem"
            exit 1
          }
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          if ($text.Contains("gtest_filter")) {
            Write-Error "otclient.exe looks like a gtest binary, refusing to package it"
            exit 1
          }
          if (-not $text.Contains("EGL_ANGLE_platform_angle")) {
            Write-Error "otclient.exe does not contain ANGLE, refusing to package it"
            exit 1
          }

          Copy-Item $exePath.FullName -Destination "$artifactDir\CrystalOTC.exe"

          $dlls = Get-ChildItem -Path $exePath.Directory.FullName -Filter "*.dll"
          foreach ($dll in $dlls) {
            Copy-Item $dll.FullName -Destination $artifactDir
          }

          # Bundle the tracked runtime files so the download is an actual client,
          # not a bare exe. Only the large game assets (data/things: appearances and
          # sprites) stay out - they are gitignored and never present in CI.
          foreach ($item in @("init.lua", "data", "modules", "mods")) {
            $src = Join-Path $env:GITHUB_WORKSPACE $item
            if (Test-Path $src) {
              Copy-Item $src -Destination $artifactDir -Recurse -Force
            }
          }

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalOTC-windows-${{ matrix.configuration }}
          path: ${{ github.workspace }}/artifacts

  release:
    name: Publish "latest" release
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: CrystalOTC-windows-release
          path: artifacts

      - name: Zip binaries
        run: cd artifacts && zip -r ../CrystalOTC-windows.zip .

      - name: Recreate "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -R "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest CrystalOTC-windows.zip \
            -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest build ($(date -u +%Y-%m-%d), ${GITHUB_SHA::7})" \
            --notes "Automatic build of the latest \`main\` commit ${GITHUB_SHA::7}.

          Contains a runnable client: the executable plus init.lua, data, modules and mods. Only the large game assets (\`data/things\`: appearances and sprites) are NOT included - add them separately (see the README or the wiki's Game Assets page)."
