name: Build - Windows

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - "vcpkg.json"
      - "CMakeLists.txt"
      - ".github/workflows/build-windows.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "vcpkg.json"
      - "CMakeLists.txt"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read
  pull-requests: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  MAKEFLAGS: "-j 2"
  # run-vcpkg otherwise sets VCPKG_BINARY_SOURCES to 'clear;x-gha,readwrite'; that backend has
  # been removed from vcpkg, so it warns and nothing is cached and every run rebuilds all of
  # the ports from source. Point it at a directory actions/cache can restore, exactly as the
  # macOS and Linux workflows already do. run-vcpkg also aims VCPKG_DEFAULT_BINARY_CACHE at a
  # path outside the workspace, which actions/cache can never see.
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.cache/vcpkg,readwrite"

jobs:
  build:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: windows-2022-release
    runs-on: windows-2022

    concurrency:
      group: crystalotc-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get vcpkg commit ID
        id: vcpkg-step
        shell: pwsh
        run: |
          $json = Get-Content vcpkg.json -Raw | ConvertFrom-Json
          $commit = $json.'builtin-baseline'
          echo "vcpkgGitCommitId=$commit" >> $env:GITHUB_OUTPUT

      - name: Validate vcpkg baseline SHA
        shell: pwsh
        run: |
          $SHAS = "${{ steps.vcpkg-step.outputs.vcpkgGitCommitId }}"
          if ([string]::IsNullOrEmpty($SHAS)) {
            echo "::error title=Missing vcpkg baseline::Provide a full 40-char vcpkgGitCommitId."
            exit 1
          }
          if ($SHAS -notmatch '^[0-9a-f]{40}$') {
            echo "::error title=Invalid vcpkg baseline::vcpkgGitCommitId must be a full 40-char commit SHA."
            exit 1
          }

      - name: Compute vcpkg.json hash
        id: hash
        shell: pwsh
        run: |
          $json = Get-Content "vcpkg.json" -Raw -Encoding UTF8
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($json)
          $sha256 = [System.Security.Cryptography.SHA256]::Create()
          $hashBytes = $sha256.ComputeHash($bytes)
          $hash = [BitConverter]::ToString($hashBytes) -replace '-', ''
          "hash=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # vcpkg aborts at startup when VCPKG_DEFAULT_BINARY_CACHE names a directory that does
      # not exist, and actions/cache does not create it on a miss.
      - name: Create binary cache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      # Caches the BINARY cache plus downloads, not installed/buildtrees. Restoring build trees
      # does not stop a rebuild - vcpkg decides from ABI hashes and its binary cache - so the
      # previous 3.5 GB restore bought nothing but the minute and a half it took.
      - name: Restore vcpkg binaries and downloads
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ github.workspace }}/.cache/vcpkg
            ${{ github.workspace }}/vcpkg/downloads
          key: vcpkg-windows-release-${{ steps.hash.outputs.hash }}
          restore-keys: |
            vcpkg-windows-release-

      - name: Compiler cache (sccache)
        uses: hendrikmuhs/ccache-action@main
        with:
          max-size: "1G"
          variant: "sccache"
          key: ccache-windows-release
          restore-keys: |
            ccache-windows-release

      - name: Remove Windows pre-installed MySQL (for clean builds)
        run: Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "C:/mysql*"

      - name: Install vcpkg
        uses: lukka/run-vcpkg@a400452f634fe49e9f18d388aeb1809dcc642136
        with:
          vcpkgGitCommitId: ${{ steps.vcpkg-step.outputs.vcpkgGitCommitId }}

      - name: Get latest CMake and Ninja
        uses: lukka/get-cmake@v3.31.6

      - name: Configure and Build
        uses: lukka/run-cmake@main
        with:
          configurePreset: windows-release
          buildPreset: windows-release

      # Save explicitly, including when a later build/test step fails. This means a failed first
      # build that has already compiled vcpkg ports still warms the next run instead of forcing
      # another full dependency rebuild.
      - name: Save vcpkg binaries and downloads
        if: ${{ always() && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ github.workspace }}/.cache/vcpkg
            ${{ github.workspace }}/vcpkg/downloads
          key: vcpkg-windows-release-${{ steps.hash.outputs.hash }}

      # This job used to compile the test suite and never run it. The renderer-boundary
      # golden frame is asserted to be byte-identical on every platform, and MSVC/x86-64 is
      # the toolchain furthest from the one that produced the checked-in golden, so it is
      # the one most worth running it on.
      - name: Run unit tests
        shell: pwsh
        run: ctest --test-dir build/windows-release --output-on-failure

      - name: Prepare artifact folder
        shell: pwsh
        run: |
          $artifactDir = "$env:GITHUB_WORKSPACE\artifacts"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

          # Tests are named otclient_<suite>_tests.exe. Searching recursively for
          # otclient*.exe can therefore package the GoogleTest runner instead of the
          # client, which opens a console, runs its tests and exits immediately.
          # The production target has one deterministic output location with the
          # windows-release preset.
          $exePath = Join-Path $env:GITHUB_WORKSPACE "build\windows-release\bin\otclient.exe"

          if (-not (Test-Path -LiteralPath $exePath -PathType Leaf)) {
            Write-Error "Production client executable not found at $exePath"
            exit 1
          }

          Copy-Item $exePath -Destination "$artifactDir\CrystalOTC.exe"

          $dlls = Get-ChildItem -Path (Split-Path -Parent $exePath) -Filter "*.dll"
          foreach ($dll in $dlls) {
            Copy-Item $dll.FullName -Destination $artifactDir
          }

          # Bundle the tracked runtime files so the download is an actual client,
          # not a bare exe. Only the large game assets (data/things: appearances and
          # sprites) stay out - they are gitignored and never present in CI.
          foreach ($item in @("init.lua", "data", "modules", "mods")) {
            $src = Join-Path $env:GITHUB_WORKSPACE $item
            if (Test-Path $src) {
              Copy-Item $src -Destination $artifactDir -Recurse -Force
            }
          }

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalOTC-windows-release
          path: ${{ github.workspace }}/artifacts

  release:
    name: Publish "latest" release
    # Never publish from a fork. The step deletes and recreates a public "latest" release and
    # its tag on every push to main, which on a development fork is noise at best and a
    # download that can be mistaken for an upstream build at worst. A fork's default workflow
    # token is also read-only, so the job could only fail there: it already declares
    # contents: write, but the repository-level default caps the token and the release API
    # returns 403 regardless.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.repository.fork == false }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: CrystalOTC-windows-release
          path: artifacts

      - name: Zip binaries
        run: cd artifacts && zip -r ../CrystalOTC-windows.zip .

      - name: Recreate "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -R "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest CrystalOTC-windows.zip \
            -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest build ($(date -u +%Y-%m-%d), ${GITHUB_SHA::7})" \
            --notes "Automatic build of the latest \`main\` commit ${GITHUB_SHA::7}.

          Contains a runnable client: the executable plus init.lua, data, modules and mods. Only the large game assets (\`data/things\`: appearances and sprites) are NOT included - add them separately (see the README or the wiki's Game Assets page)."
