---
# Schema is actions/labeler v5 and later. The v4 form ("- any: [glob]") is not
# understood by the pinned v7 action and silently labels nothing.
"Area: Source":
  - changed-files:
      - any-glob-to-any-file: 'src/**/*'

"Area: Datapack":
  - changed-files:
      - any-glob-to-any-file: 'data/**/*'
